<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITS TTS - Text to Speech</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <div class="main-content">
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
                <span class="logo-text">VITS TTS</span>
            </div>
            <p class="tagline">High-Quality Neural Text-to-Speech Synthesis</p>
        </header>

        <main class="card">
            <div class="input-group">
                <label for="text-input" class="input-label">
                    <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    Enter Text
                </label>
                <textarea
                    id="text-input"
                    class="text-input"
                    rows="4"
                    placeholder="Type your text here to synthesize speech..."
                >The quick brown fox jumps over the lazy dog.</textarea>
            </div>

            <div class="controls-row">
                <div class="language-group">
                    <label for="language" class="control-label">Language</label>
                    <div class="select-wrapper">
                        <select id="language" class="language-select">
                            <option value="en">English</option>
                            <option value="zh">Chinese</option>
                        </select>
                        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>

                <button id="synthesize-btn" class="synthesize-btn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Synthesize</span>
                </button>
            </div>

            <div id="status" class="status-bar">
                <span class="status-text">Ready to synthesize</span>
            </div>

            <div id="output-section" class="output-section hidden">
                <div class="output-header">
                    <h2 class="output-title">
                        <svg class="output-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18V5l12-2v13"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                        Generated Audio
                    </h2>
                    <button id="download-btn" class="download-btn">
                        <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download
                    </button>
                </div>
                <audio id="audio-player" class="audio-player" controls></audio>
            </div>
        </main>

        <section class="examples-section">
            <h3 class="examples-title">Try Examples</h3>
            <div class="examples-grid">
                <button class="example-btn" data-text="Hello world, this is a test of text to speech synthesis.">Hello World</button>
                <button class="example-btn" data-text="The quick brown fox jumps over the lazy dog.">Pangram</button>
                <button class="example-btn" data-text="Artificial intelligence is transforming the world.">AI Quote</button>
                <button class="example-btn" data-text="To be or not to be, that is the question.">Shakespeare</button>
            </div>
        </section>

        <footer class="footer">
            <p>VITS Model • checkpoint_epoch_10.pt</p>
        </footer>
    </div>

    <script>
        const synthesizeBtn = document.getElementById('synthesize-btn');
        const textInput = document.getElementById('text-input');
        const languageSelect = document.getElementById('language');
        const statusDiv = document.getElementById('status');
        const outputSection = document.getElementById('output-section');
        const audioPlayer = document.getElementById('audio-player');
        const downloadBtn = document.getElementById('download-btn');
        const exampleBtns = document.querySelectorAll('.example-btn');

        let currentAudioBlob = null;

        function setStatus(message, type = 'info') {
            statusDiv.className = `status-bar status-${type}`;
            statusDiv.querySelector('.status-text').textContent = message;
        }

        exampleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                textInput.value = btn.dataset.text;
                textInput.focus();
            });
        });

        synthesizeBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                setStatus('Please enter some text.', 'error');
                return;
            }

            const language = languageSelect.value;
            setStatus('Synthesizing... Please wait.', 'loading');
            synthesizeBtn.disabled = true;
            synthesizeBtn.classList.add('loading');

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text, language })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Synthesis failed');
                }

                currentAudioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(currentAudioBlob);
                audioPlayer.src = audioUrl;

                outputSection.classList.remove('hidden');
                setStatus('Synthesis complete!', 'success');
            } catch (error) {
                setStatus('Error: ' + error.message, 'error');
            } finally {
                synthesizeBtn.disabled = false;
                synthesizeBtn.classList.remove('loading');
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (currentAudioBlob) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(currentAudioBlob);
                a.download = 'vits_output.wav';
                a.click();
            }
        });

        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                synthesizeBtn.click();
            }
        });
    </script>
</body>
</html>
